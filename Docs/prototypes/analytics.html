   TOKENS — copied from Montra/Design/Theme.swift
   ============================================================ */
:root{
  --radius-card:14px;
  --radius-chip:8px;
  --radius-sm:6px;
  --page-inset:24px;
  --card-pad:14px;
  --font-body:"Onest",-apple-system,"Inter",system-ui,sans-serif;
  --motion-fast:.12s;
  --motion-row:.22s;
  --motion-number:.45s;
}
html[data-theme="dark"]{
  --surface-base:#171615;
  --surface-card:#1E1D1C;
  --surface-raised:#2B2A28;
  --fill-secondary:#282725;
  --fill-hover:#2F2E2C;
  --fill-pressed:#373533;
  --border-subtle:#302F2D;
  --border-strong:#3D3B38;
  --text-primary:#ECEAE6;
  --text-secondary:#A6A39D;
  --text-tertiary:#807D78;
  --action-primary:#ECEAE6;
  --on-action:#171615;
  --accent:#4C9EEA;
  --safe:#5FD36B;
  --safe-fill:#1B2E22;
  --check:#F2B84B;
  --check-fill:#332910;
  --danger:#F47468;
  --danger-fill:#321B19;
  --unsure:#A9A6A0;
  --unsure-fill:#282725;
  --backdrop:#151514;
  --window-border:rgba(0,0,0,.18);
  --window-shadow:0 24px 60px rgba(0,0,0,.35);
  --chart-blue:#3A94D0;   --chart-green:#4FC261;  --chart-teal:#35B98D;
  --chart-amber:#F0B020;  --chart-orange:#E8772A; --chart-red:#E05A4B;
  --chart-pink:#DA93BA;   --chart-purple:#9B7BE0; --chart-graphite:#6E6B66;
  --chart-sky:#6CC3F0;
  --tile-blue:#1E78BA;    --tile-green:#2E9E4B;   --tile-teal:#109C7C;
  --tile-amber:#CC9000;   --tile-orange:#D55E00;  --tile-red:#C94036;
  --tile-pink:#BE6C9C;    --tile-purple:#7A5AC4;  --tile-graphite:#6E6B66;
  --tile-sky:#3A9BD5;
}
html[data-theme="light"]{
  --surface-base:#F6F5F3;
  --surface-card:#FFFFFF;
  --surface-raised:#FFFFFF;
  --fill-secondary:#EFEDEA;
  --fill-hover:#E8E6E2;
  --fill-pressed:#DFDCD8;
  --border-subtle:#E6E3DF;
  --border-strong:#D5D2CD;
  --text-primary:#2E2D2B;
  --text-secondary:#64625E;
  --text-tertiary:#85827C;
  --action-primary:#353431;
  --on-action:#FFFFFF;
  --accent:#0A6ED1;
  --safe:#1F7A35;
  --safe-fill:#E6F4EA;
  --check:#8A5300;
  --check-fill:#FAEEDA;
  --danger:#B4302A;
  --danger-fill:#FBE8E5;
  --unsure:#5A5853;
  --unsure-fill:#EFEDEA;
  --backdrop:#E7E6E3;
  --window-border:rgba(0,0,0,.18);
  --window-shadow:0 18px 48px rgba(0,0,0,.16);
  --chart-blue:#0072B2;   --chart-green:#2C8A3E;  --chart-teal:#009E73;
  --chart-amber:#E69F00;  --chart-orange:#D55E00; --chart-red:#C0392B;
  --chart-pink:#CC79A7;   --chart-purple:#7D5BC6; --chart-graphite:#8C8983;
  --chart-sky:#56B4E9;
  --tile-blue:#0072B2;    --tile-green:#2C8A3E;   --tile-teal:#00856A;
  --tile-amber:#C98A00;   --tile-orange:#D55E00;  --tile-red:#B4302A;
  --tile-pink:#B35A8D;    --tile-purple:#6B4BB0;  --tile-graphite:#8C8983;
  --tile-sky:#3399D3;
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--backdrop);
  color:var(--text-primary);
  font-family:var(--font-body);
  font-size:13px;
  line-height:18px;
  letter-spacing:.15px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;color:inherit}
button,#scopePeriod,#scopeMonth,.chip,.seg,.slice-row,.step-btn,.dev-btn{cursor:pointer}
button:focus-visible,
[tabindex]:focus-visible,
.chip:focus-visible,
.seg:focus-visible{
  outline:2px solid color-mix(in srgb, var(--accent) 45%, transparent);
  outline-offset:2px;
}
[hidden]{display:none!important}

/* The one figure face. Onest has no digits by design. */
.num{
  font-family:ui-rounded,"SF Pro Rounded","SF Compact Rounded",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
  letter-spacing:0;
}
.fig-anim{opacity:.55;transition:opacity .18s ease-out}

/* ============================================================
   STAGE + WINDOW
   ============================================================ */
.stage{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
  padding:24px;
}
.frame{
  width:980px;
  display:flex;
  flex-direction:column;
  gap:18px;
}
.window{
  position:relative;
  width:980px;
  height:700px;
  display:flex;
  flex:0 0 auto;
  border-radius:12px;
  overflow:hidden;
  background:var(--surface-base);
  border:1px solid var(--window-border);
  box-shadow:var(--window-shadow);
}
.traffic{
  position:absolute;
  top:19px;
  left:20px;
  display:flex;
  gap:8px;
  z-index:5;
}
.traffic span{width:12px;height:12px;border-radius:50%}
.traffic span:nth-child(1){background:#FF5F57}
.traffic span:nth-child(2){background:#FEBC2E}
.traffic span:nth-child(3){background:#28C840}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar{
  width:240px;
  flex:0 0 240px;
  background:var(--surface-card);
  border-right:1px solid var(--border-subtle);
  padding:0 12px 12px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  z-index:2;
}
.brand{
  height:22px;
  margin:42px 0 24px;
  padding:0 4px;
  display:flex;
  align-items:center;
  gap:8px;
}
.mascot{
  position:relative;
  width:22px;
  height:22px;
  flex:0 0 22px;
  border-radius:5px;
  overflow:hidden;
  background:linear-gradient(145deg,#3E7BD6,#7A4BC4 62%,#C25E3F);
}
.mascot img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.mascot-fb{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:#fff;
  font:600 11px/1 var(--font-body);
}
.brand-name{font-size:15px;line-height:20px;font-weight:600;letter-spacing:.1px}

.nav{display:flex;flex-direction:column;gap:2px;min-height:0}
.navrow{
  width:100%;
  height:28px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 8px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:var(--text-secondary);
  font:500 13px/18px var(--font-body);
  letter-spacing:.15px;
  text-align:left;
  transition:background var(--motion-fast) ease-out,color var(--motion-fast) ease-out;
}
.navrow:hover{background:var(--surface-raised);color:var(--text-primary)}
.navrow.is-selected{background:var(--fill-secondary);color:var(--text-primary);font-weight:600}
.navrow .ic{flex:0 0 16px;opacity:.94}
.navrow .count{
  margin-left:auto;
  font-size:11px;
  line-height:14px;
  font-weight:600;
  color:var(--text-tertiary);
}
.side-label{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 8px 2px;
  font-size:11px;
  line-height:14px;
  font-weight:600;
  letter-spacing:.3px;
  color:var(--text-tertiary);
}
.add-circle{
  width:18px;
  height:18px;
  padding:0;
  border:0;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--fill-secondary);
  color:var(--text-secondary);
  opacity:.5;
  transition:opacity var(--motion-fast) ease-out,background var(--motion-fast) ease-out;
}
.side-label:hover .add-circle{opacity:1}
.add-circle:hover{background:var(--fill-hover);color:var(--text-primary)}
.acctrow{
  width:100%;
  height:28px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 8px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:var(--text-secondary);
  font:500 13px/18px var(--font-body);
  letter-spacing:.15px;
  text-align:left;
  transition:background var(--motion-fast) ease-out;
}
.acctrow:hover{background:var(--surface-raised)}
.acct-glyph{
  width:16px;
  flex:0 0 16px;
  display:grid;
  place-items:center;
  color:var(--glyph,var(--text-tertiary));
}
.acctrow .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acctrow .bal{
  margin-left:auto;
  flex:0 0 auto;
  font-size:11px;
  line-height:14px;
  font-weight:600;
  color:var(--text-tertiary);
  white-space:nowrap;
}
.sidebar-bottom{
  margin-top:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding-top:12px;
}
.new-account{
  height:30px;
  width:100%;
  border:1px solid var(--border-strong);
  border-radius:999px;
  background:var(--fill-secondary);
  color:var(--text-primary);
  font-size:13px;
  font-weight:600;
  letter-spacing:.15px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition:background var(--motion-fast) ease-out;
}
.new-account:hover{background:var(--fill-hover)}
.sidebar-bottom .navrow{font-weight:500}
.icloud{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  padding:12px;
  border:0;
  border-radius:14px;
  background:var(--fill-secondary);
  color:var(--text-secondary);
  font-size:12px;
  line-height:16px;
  font-weight:500;
  letter-spacing:.25px;
  text-align:left;
  transition:background var(--motion-fast) ease-out;
}
.icloud:hover{background:var(--fill-hover)}
.icloud .ic{flex:0 0 16px;color:var(--text-secondary)}

/* ============================================================
   MAIN
   ============================================================ */
.main{
  width:740px;
  flex:1 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:var(--surface-base);
}
.page-header{
  flex:0 0 auto;
  padding:20px 24px 12px;
  display:flex;
  align-items:flex-start;
  gap:16px;
}
.header-text{min-width:0;flex:1 1 auto}
h1{
  margin:0;
  font-size:20px;
  line-height:26px;
  font-weight:600;
  letter-spacing:0;
}
.subtitle{
  margin:3px 0 0;
  font-size:11px;
  line-height:14px;
  font-weight:400;
  letter-spacing:.3px;
  color:var(--text-secondary);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.subtitle .sep{color:var(--text-tertiary)}
.header-actions{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:8px;
  padding-top:0;
}
/* Scope: two separate capsules, the app's FilterChip family — no track. */
.scope{
  display:flex;
  align-items:center;
  gap:8px;
}
.scope button{
  height:28px;
  padding:0 12px;
  border:1px solid var(--border-subtle);
  border-radius:999px;
  background:var(--fill-secondary);
  color:var(--text-secondary);
  font-size:13px;
  line-height:18px;
  font-weight:500;
  letter-spacing:.15px;
  white-space:nowrap;
  transition:background var(--motion-fast) ease-out,color var(--motion-fast) ease-out;
}
.scope button:hover{background:var(--fill-hover);color:var(--text-primary)}
.scope button[aria-pressed="true"]{
  background:var(--surface-raised);
  border-color:var(--border-subtle);
  color:var(--text-primary);
  font-weight:600;
}
.stepper{
  height:28px;
  min-width:214px;
  padding:0 2px;
  display:flex;
  align-items:center;
  gap:2px;
  background:var(--fill-secondary);
  border:1px solid var(--border-strong);
  border-radius:999px;
}
.step-btn{
  width:24px;
  height:24px;
  flex:0 0 24px;
  padding:0;
  border:0;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:transparent;
  color:var(--text-secondary);
  transition:background var(--motion-fast) ease-out,color var(--motion-fast) ease-out;
}
.step-btn:hover:not(:disabled){background:var(--fill-hover);color:var(--text-primary)}
.step-btn:disabled{opacity:.35;cursor:default}
.stepper-label{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:13px;
  line-height:18px;
  font-weight:600;
  letter-spacing:.1px;
  color:var(--text-secondary);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.stepper-label .ic{color:var(--text-secondary);flex:0 0 11px}

.content{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:0 24px 24px;
  display:flex;
  flex-direction:column;
  gap:24px;
  scrollbar-width:none;
  overscroll-behavior:contain;
}
.content::-webkit-scrollbar{width:0;height:0}
.content > *{flex:0 0 auto}
.ic{fill:currentColor}

/* ============================================================
   CARDS
   ============================================================ */
.card{
  background:var(--surface-card);
  border:.5px solid var(--border-subtle);
  border-radius:var(--radius-card);
  overflow:hidden;
}
.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 14px 0;
}
.card-head h2{
  margin:0;
  font-size:13px;
  line-height:18px;
  font-weight:600;
  letter-spacing:.15px;
  color:var(--text-primary);
}

/* Summary */
.summary{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  padding:16px;
}
.summary-cell{
  position:relative;
  min-width:0;
  padding:0 16px;
}
.summary-cell:first-child{padding-left:0}
.summary-cell:last-child{padding-right:0}
.summary-cell + .summary-cell::before{
  content:"";
  position:absolute;
  left:0;
  top:12px;
  bottom:12px;
  width:.5px;
  background:var(--border-subtle);
}
.summary-label{
  font-size:11px;
  line-height:14px;
  letter-spacing:.3px;
  color:var(--text-secondary);
  white-space:nowrap;
}
.summary-value{
  margin-top:2px;
  font-size:22px;
  line-height:28px;
  font-weight:700;
  color:var(--text-primary);
  white-space:nowrap;
}
.summary-sub{
  margin-top:2px;
  min-height:14px;
  font-size:11px;
  line-height:14px;
  letter-spacing:.3px;
  color:var(--text-tertiary);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.delta{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.arrow{flex:0 0 auto;display:inline-block;vertical-align:-1px}
.tone-check{color:var(--check)}
.tone-safe{color:var(--safe)}
.tone-neutral{color:var(--text-tertiary)}
.tone-danger{color:var(--danger)}

/* Dimension + filter chips: the app's FilterChip — one capsule family. */
.head-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.dim{display:flex;align-items:center;gap:8px}
.chip{
  height:28px;
  padding:0 12px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--border-subtle);
  border-radius:999px;
  background:var(--fill-secondary);
  color:var(--text-secondary);
  font-size:13px;
  line-height:18px;
  font-weight:500;
  letter-spacing:.15px;
  white-space:nowrap;
  transition:background var(--motion-fast) ease-out,color var(--motion-fast) ease-out,border-color var(--motion-fast) ease-out;
}
.chip:hover{background:var(--fill-hover);color:var(--text-primary)}
.chip[aria-pressed="true"]{
  background:var(--surface-raised);
  border-color:var(--border-subtle);
  color:var(--text-primary);
  font-weight:600;
}
.chip .n{font-size:11px;line-height:14px;font-weight:600;color:var(--text-tertiary)}
.chip[aria-pressed="true"] .n{color:var(--text-secondary)}
.filter-row{
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px 14px 0;
  flex-wrap:wrap;
}

/* Segmented bar */
.bar-wrap{margin:12px 14px 0}
.bar{
  height:14px;
  display:flex;
  gap:2px;
  border-radius:999px;
  overflow:hidden;
  background:var(--fill-secondary);
}
.bar.is-empty{background:var(--fill-secondary)}
.seg{
  height:14px;
  flex:0 0 auto;
  padding:0;
  border:0;
  border-radius:0;
  transition:opacity var(--motion-fast) ease-out;
}
.bar.has-hl .seg:not(.is-lit){opacity:.3}
.seg:focus-visible{outline-offset:-2px}

/* Slice rows */
.slices{padding:8px 14px 10px}
.slice{position:relative}
.slice + .slice{border-top:.5px solid var(--border-subtle)}
.slice-row{
  position:relative;
  width:100%;
  min-height:48px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0;
  border:0;
  border-radius:8px;
  background:transparent;
  text-align:left;
  color:var(--text-primary);
  transition:background var(--motion-fast) ease-out;
}
.slice-row:hover,
.slice.is-selected .slice-row,
.slice.is-hl > .slice-row{
  background:color-mix(in srgb, var(--fill-secondary) 50%, transparent);
}
.slice-row:focus-visible{outline-offset:-2px}
.tile{
  width:28px;
  height:28px;
  flex:0 0 28px;
  display:grid;
  place-items:center;
  border-radius:7.28px;
  color:#fff;
  background-image:
    linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 58%),
    linear-gradient(0deg,rgba(0,0,0,.12),rgba(0,0,0,0) 55%),
    linear-gradient(var(--tile),var(--tile));
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.28),0 .5px .5px rgba(0,0,0,.14);
}
.tile .ic{filter:drop-shadow(0 .5px .5px rgba(0,0,0,.2))}
.slice-text{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:2px}
.slice-title{font-size:13px;line-height:18px;font-weight:600;letter-spacing:.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slice-detail{font-size:12px;line-height:16px;font-weight:400;letter-spacing:.25px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slice-right{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:2px;
  text-align:right;
}
.slice-amount{font-size:15px;line-height:19px;font-weight:600;white-space:nowrap}
.slice-meta{display:flex;align-items:center;gap:5px;font-size:11px;line-height:14px;font-weight:400;letter-spacing:.3px;color:var(--text-secondary);white-space:nowrap}
.slice-meta .dot{color:var(--text-tertiary)}
.ops-inline{
  margin:2px 0 10px 28px;
  padding:10px;
  border-radius:8px;
  background:var(--fill-secondary);
  animation:opsReveal var(--motion-row) ease-out both;
}
@keyframes opsReveal{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}
.op-line{
  display:flex;
  align-items:baseline;
  gap:8px;
  min-height:18px;
  font-size:12px;
  line-height:18px;
  letter-spacing:.25px;
}
.op-line + .op-line{margin-top:3px}
.op-date{flex:0 0 46px;font-size:11px;line-height:14px;letter-spacing:.3px;color:var(--text-tertiary);white-space:nowrap}
.op-place{min-width:0;flex:1 1 auto;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op-amt{flex:0 0 auto;font-size:12px;line-height:18px;font-weight:500;color:var(--text-secondary);white-space:nowrap}
.filter-empty{
  padding:14px;
  font-size:12px;
  line-height:16px;
  color:var(--text-tertiary);
  letter-spacing:.25px;
}

/* Observations */
.obs-row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.obs-row + .obs-row{border-top:.5px solid var(--border-subtle)}
.obs-text{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:2px}
.obs-title{font-size:13px;line-height:18px;font-weight:600;letter-spacing:.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obs-detail{font-size:11px;line-height:14px;font-weight:400;letter-spacing:.3px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Pace */
.badge{
  display:inline-flex;
  align-items:center;
  height:18px;
  padding:2px 6px;
  border-radius:6px;
  font-size:10px;
  line-height:12px;
  font-weight:600;
  letter-spacing:.4px;
  white-space:nowrap;
}
.badge.tone-check{background:var(--check-fill);color:var(--check)}
.badge.tone-safe{background:var(--safe-fill);color:var(--safe)}
.badge.tone-neutral{background:var(--unsure-fill);color:var(--unsure)}
.pace-line{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  padding:12px 14px 0;
}
.pace-average{display:flex;align-items:baseline;gap:5px;min-width:0}
.pace-words{font-size:12px;line-height:16px;font-weight:400;letter-spacing:.25px;color:var(--text-secondary);white-space:nowrap}
.pace-avg{font-size:22px;line-height:28px;font-weight:700;white-space:nowrap}
.pace-elapsed{font-size:11px;line-height:14px;letter-spacing:.3px;color:var(--text-tertiary);white-space:nowrap;padding-bottom:2px}
.pace-elapsed .num{color:var(--text-tertiary)}
/* Key for the pace chart, right-aligned in the card header. */
.pace-head-right{display:flex;align-items:center;gap:12px;flex:0 0 auto;min-width:0}
.chart-key{display:flex;align-items:center;gap:10px;font-size:11px;line-height:14px;letter-spacing:.3px;color:var(--text-tertiary);white-space:nowrap}
.chart-key .k{display:inline-flex;align-items:center;gap:4px}
.chart-key .sw{width:12px;height:2px;flex:0 0 12px;border-radius:1px}
.chart-key .sw-cur{background:var(--text-primary)}
.chart-key .sw-prev{background:repeating-linear-gradient(90deg,var(--text-secondary) 0 4px,transparent 4px 7px);opacity:.85}
.chart-key .sw-pace{background:repeating-linear-gradient(90deg,var(--text-tertiary) 0 1.5px,transparent 1.5px 3.5px)}
.chart-wrap{position:relative;margin:8px 14px 0;height:168px}
.chart-svg{display:block;width:664px;height:168px;overflow:visible;border-radius:6px}
.chart-svg:focus-visible{outline:2px solid color-mix(in srgb, var(--accent) 45%, transparent);outline-offset:3px}
.chart-grid{stroke:var(--border-subtle);stroke-opacity:.45;stroke-width:1}
.chart-label{fill:var(--text-tertiary);font-family:ui-rounded,"SF Pro Rounded","SF Compact Rounded",system-ui,sans-serif;font-size:10px;font-variant-numeric:tabular-nums;letter-spacing:0}
.chart-label-word{font-family:var(--font-body);font-size:10px;letter-spacing:.3px}
/* Previous line: secondary at .60 so it clears 3:1 against the card. */
.chart-prev{fill:none;stroke:var(--text-secondary);stroke-opacity:.60;stroke-width:1.5;stroke-dasharray:4 3;stroke-linejoin:round;stroke-linecap:round}
/* Even pace: a reference, not data — thinner and fainter than the previous line. */
.chart-pace{fill:none;stroke:var(--text-tertiary);stroke-opacity:.45;stroke-width:1;stroke-dasharray:3 2;stroke-linecap:round}
.chart-cur{fill:none;stroke:var(--text-primary);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart-today{stroke:var(--border-strong);stroke-width:1;stroke-dasharray:3 3}
.chart-dot-ring{fill:var(--surface-card)}
.chart-dot{fill:var(--text-primary)}
.chart-cross{stroke:var(--border-strong);stroke-width:1}
.chart-tip{
  position:absolute;
  z-index:3;
  width:158px;
  padding:8px;
  border:.5px solid var(--border-subtle);
  border-radius:8px;
  background:var(--surface-raised);
  pointer-events:none;
}
.chart-tip .tip-date{font-size:11px;line-height:14px;letter-spacing:.3px;color:var(--text-tertiary)}
.chart-tip .tip-value{margin-top:2px;font-size:13px;line-height:18px;font-weight:600}
.chart-tip .tip-prev{margin-top:2px;font-size:11px;line-height:14px;letter-spacing:.3px;color:var(--text-secondary)}
.verdict{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin-top:12px;
  padding:12px 14px 14px;
  border-top:.5px solid var(--border-subtle);
}
.verdict .arrow{flex:0 0 12px;margin-top:2px}
.verdict p{margin:0;font-size:12px;line-height:17px;font-weight:400;letter-spacing:.25px;color:var(--text-secondary)}

/* Calendar heat map */
.legend{display:flex;align-items:center;gap:4px;font-size:11px;line-height:14px;letter-spacing:.3px;color:var(--text-tertiary);white-space:nowrap}
.legend .sq{width:10px;height:10px;border-radius:2px;flex:0 0 10px;overflow:hidden;box-shadow:inset 0 0 0 .5px var(--border-strong)}
.legend .sq i{display:block;width:100%;height:100%;background:var(--text-primary)}
.legend .lbl{margin:0 2px}
.heat-week{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:6px;
  padding:10px 14px 0;
}
.heat-week span{
  text-align:center;
  font-size:10px;
  line-height:12px;
  font-weight:600;
  letter-spacing:.4px;
  color:var(--text-tertiary);
}
.heat-week span.is-weekend{opacity:.55}
/* One role="row" per week so the grid is structurally a grid. */
.heat-grid{
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:6px 14px 0;
  border-radius:8px;
}
.heat-row{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:6px;
}
.heat-grid:focus-visible{outline:2px solid color-mix(in srgb, var(--accent) 45%, transparent);outline-offset:4px}
.heat-cell{
  position:relative;
  height:44px;
  border-radius:8px;
  overflow:hidden;
  background:transparent;
  transition:box-shadow var(--motion-fast) ease-out;
}
.heat-cell::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:8px;
  background:var(--text-primary);
  opacity:var(--ramp,0);
}
/* No-spend days: the same ink family, barely there. */
.heat-cell.is-zero::before{background:var(--text-primary);opacity:.02}
.heat-cell.is-future{border:.75px dashed var(--border-subtle);opacity:.35}
.heat-cell.is-future::before{display:none}
.heat-cell.is-today{box-shadow:inset 0 0 0 1.5px var(--text-primary)}
.heat-cell.is-active:not(.is-today){box-shadow:inset 0 0 0 1px var(--text-secondary)}
.heat-cell.is-empty{background:transparent}
.heat-day{
  position:absolute;
  top:4px;
  left:6px;
  font-size:10px;
  line-height:12px;
  font-weight:400;
  color:var(--text-primary);
  white-space:nowrap;
  z-index:1;
}
.heat-cell.is-zero .heat-day{color:var(--text-tertiary)}
.heat-amt{
  position:absolute;
  right:6px;
  bottom:4px;
  max-width:calc(100% - 12px);
  font-size:11px;
  line-height:14px;
  font-weight:400;
  color:var(--text-primary);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  z-index:1;
}
.heat-readout{
  min-height:38px;
  padding:10px 14px 12px;
  display:block;
  font-size:12px;
  line-height:16px;
  font-weight:400;
  letter-spacing:.25px;
  color:var(--text-secondary);
}
.heat-readout.is-active{color:var(--text-primary)}
.heat-readout .num{color:var(--text-primary)}

/* Empty state */
.empty-card{display:grid;place-items:center;padding:32px 24px}
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:440px}
.empty-icon{
  width:40px;
  height:40px;
  border:1.2px dashed var(--border-strong);
  border-radius:8px;
  display:grid;
  place-items:center;
  color:var(--text-tertiary);
}
.empty-title{margin-top:12px;font-size:15px;line-height:20px;font-weight:600;letter-spacing:0}
.empty-msg{margin-top:2px;font-size:12px;line-height:17px;font-weight:400;letter-spacing:.25px;color:var(--text-secondary)}
.empty-action{
  margin-top:10px;
  height:24px;
  padding:0 10px;
  border:1px solid var(--border-strong);
  border-radius:999px;
  background:var(--fill-secondary);
  color:var(--text-primary);
  font-size:12px;
  line-height:16px;
  font-weight:600;
  letter-spacing:.25px;
}
.empty-action:hover{background:var(--fill-hover)}

/* ============================================================
   DEV PANEL — deliberately outside the product
   ============================================================ */
.dev{
  width:692px;
  align-self:flex-start;
  margin-left:264px;
  padding:9px 12px 10px;
  border:1px dashed var(--border-strong);
  border-radius:8px;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:11px;
  line-height:16px;
  letter-spacing:0;
  color:var(--text-tertiary);
}
.dev-row{display:flex;align-items:center;gap:12px;min-height:20px;flex-wrap:wrap}
.dev-title{color:var(--text-secondary)}
.dev-title b{font-weight:600}
.dev-group{display:flex;align-items:center;gap:5px}
.dev-label{color:var(--text-tertiary)}
.dev-btn{
  height:20px;
  padding:0 7px;
  border:1px solid var(--border-strong);
  border-radius:5px;
  background:transparent;
  color:var(--text-secondary);
  font:inherit;
}
.dev-btn[aria-pressed="true"]{background:var(--surface-raised);color:var(--text-primary)}
.dev-spacer{margin-left:auto}
.dev-status{color:var(--safe)}
.dev-status.is-bad{color:var(--danger)}
.dev-data{color:var(--text-tertiary);white-space:nowrap}
.dev-note{color:var(--text-tertiary);opacity:.78;font-size:10.5px}
.dev-flash{color:var(--check)}

/* ============================================================
   REDUCED MOTION
   ============================================================ */
@media (max-width:1028px){
  .stage{padding:0 0 24px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
    scroll-behavior:auto!important;
  }
}

/* ---------- data --------------------------------------------------------- */
const DATA = window.MONTRA_ANALYTICS;
const PERIODS = DATA.periods.map(function(p){
  const startD = parseISO(p.start), endD = parseISO(p.end);
  return {
    key:p.key, title:p.title, start:p.start, end:p.end, today:p.today,
    startD:startD, endD:endD, todayD:parseISO(p.today),
    totalDays:dayDiff(startD, endD) + 1
  };
});
const ALL_OPS = DATA.operations.map(function(o){
  return Object.assign({}, o, {dateD:parseISO(o.date)});
});
const TODAY = PERIODS[PERIODS.length - 1].today;
const TODAYD = parseISO(TODAY);
const CURRENT_MONTH_KEY = TODAY.slice(0, 7);
const LIVE_PERIOD_INDEX = PERIODS.findIndex(function(p){
  return p.today === TODAY && p.startD <= TODAYD && TODAYD <= p.endD;
});

const CATEGORY_ICONS = {
  housing:'house', food:'cart', transport:'tram', health:'case',
  restaurants:'fork', entertainment:'gamepad', shopping:'bag', subscriptions:'repeat'

const ACCOUNT_COLORS = {cash:'green', card:'blue', revolut:'sky', crypto:'amber'};
const ACCOUNT_ICONS = {cash:'banknote', card:'card', revolut:'building', crypto:'bitcoin'};
const CATEGORY_META = {};
for (const o of ALL_OPS){
  if (!CATEGORY_META[o.category]){
    CATEGORY_META[o.category] = {
      key:o.category, name:o.categoryName, color:o.color,
      mandatory:!!o.mandatory, icon:CATEGORY_ICONS[o.category] || 'dot'
    };

}
const ACCOUNT_META = {};
for (const o of ALL_OPS){
  if (!ACCOUNT_META[o.account]){
    ACCOUNT_META[o.account] = {
      id:o.account, name:o.accountName,
      color:ACCOUNT_COLORS[o.account] || 'graphite',
      icon:ACCOUNT_ICONS[o.account] || 'banknote'
    };
  }
}

function buildMonths(){
  const first = ALL_OPS.reduce(function(a, o){ return o.dateD < a ? o.dateD : a; }, ALL_OPS[0].dateD);
  const out = [];
  let d = startOfMonth(first);
  const last = startOfMonth(TODAYD);
  while (d <= last){
    const end = endOfMonth(d);
    const key = isoOf(d).slice(0, 7);
    out.push({
      key:key, year:d.getUTCFullYear(), month:d.getUTCMonth(),
      startD:d, endD:end, totalDays:end.getUTCDate(),
      label:monthLabel(d), current:key === CURRENT_MONTH_KEY,
      capD:key === CURRENT_MONTH_KEY ? TODAYD : end
    });
    d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1));
  }
  return out;
}
const MONTHS = buildMonths();

/* ---------- scope -------------------------------------------------------- */
const state = {
  scope:'period',
  periodIndex: LIVE_PERIOD_INDEX >= 0 ? LIVE_PERIOD_INDEX : PERIODS.length - 1,
  monthIndex: 0,
  dimension:'category',
  filter:'all',
  selected:null,
  theme:'dark',
  empty:false,
  calendarDay:null,
  chartDay:null
};
state.monthIndex = Math.max(0, MONTHS.findIndex(function(m){
  return m.key === PERIODS[state.periodIndex].today.slice(0, 7);
}));

function opsBetween(a, b){
  return ALL_OPS.filter(function(o){ return o.dateD >= a && o.dateD <= b; });
}
function periodScope(i){
  const p = PERIODS[i];
  const elapsed = Math.min(p.totalDays, dayDiff(p.startD, p.todayD) + 1);
  const live = p.today === TODAY;
  return {
    mode:'period', index:i, key:p.key,
    startD:p.startD, endD:p.endD, capD:p.todayD,
    totalDays:p.totalDays, elapsed:elapsed,
    /* AppDate.daysBetween counts both ends, so today is one of the days left. */
    daysLeft:live ? Math.max(0, dayDiff(p.todayD, p.endD) + 1) : 0,
    live:live,
    title:p.title, rangeLabel:p.title,
    ops:opsBetween(p.startD, p.todayD)
  };
}
function monthScope(i){
  const m = MONTHS[i];
  const elapsed = Math.min(m.totalDays, dayDiff(m.startD, m.capD) + 1);
  return {
    mode:'month', monthIndex:i, key:m.key,
    startD:m.startD, endD:m.endD, capD:m.capD,
    totalDays:m.totalDays, elapsed:elapsed,
    daysLeft:m.current ? Math.max(0, dayDiff(m.capD, m.endD) + 1) : 0,
    live:m.current,
    title:m.label, rangeLabel:rangeShort(m.startD, m.capD),
    ops:opsBetween(m.startD, m.capD)
  };
}
function currentScope(){
  return state.scope === 'period' ? periodScope(state.periodIndex) : monthScope(state.monthIndex);
}

/* ---------- heat ramp ----------------------------------------------------
   Five absolute steps, capped at 0.34 so 10–11px text stays above 4,5:1 in
   both themes. Index 0 is the "no spending" tint, not a step. */
const HEAT_STEPS = [0.04, 0.11, 0.19, 0.27, 0.34];
const HEAT_ZERO = 0.02;
function heatAlpha(cents){
  if (!(cents > 0)) return HEAT_ZERO;
  const br = cents / 100;
  if (br < 25) return HEAT_STEPS[0];
  if (br < 60) return HEAT_STEPS[1];
  if (br < 120) return HEAT_STEPS[2];
  if (br <= 300) return HEAT_STEPS[3];
  return HEAT_STEPS[4];
}

/* ---------- model -------------------------------------------------------- */
function sumExpenses(list){
  let total = 0;
  for (const o of list) if (o.kind === 'expense') total += o.amount;
  return total;
}
function sumBy(list, field){
  const map = new Map();
  for (const o of list){
    if (o.kind !== 'expense') continue;
    map.set(o[field], (map.get(o[field]) || 0) + o.amount);
  }
  return map;
}
function cumulativeFor(start, end, ops){
  const len = dayDiff(start, end) + 1;
  const daily = new Array(len).fill(0);
  for (const o of ops){
    if (o.kind !== 'expense') continue;
    const i = dayDiff(start, o.dateD);
    if (i >= 0 && i < len) daily[i] += o.amount;
  }
  let run = 0;
  return daily.map(function(v){ run += v; return run; });
}
/* One baseline everywhere: the previous span truncated to the same elapsed
   days. The full previous total is kept, but only the verdict names it. */
function buildComparison(s){
  let base;
  if (s.mode === 'period'){
    if (s.index === 0) return null;
    const p = PERIODS[s.index - 1];
    base = {startD:p.startD, endD:p.endD, totalDays:p.totalDays};
  } else {
    if (s.monthIndex === 0) return null;
    const m = MONTHS[s.monthIndex - 1];
    base = {startD:m.startD, endD:m.endD, totalDays:m.totalDays};
  }
  const ops = opsBetween(base.startD, base.endD);
  const fullTotal = sumExpenses(ops);
  const windowDays = Math.max(1, Math.min(s.elapsed, base.totalDays));
  const windowEnd = addDays(base.startD, windowDays - 1);
  const wops = ops.filter(function(o){ return o.dateD <= windowEnd; });
  return {
    mode:s.mode, fullTotal:fullTotal,
    fullCum:cumulativeFor(base.startD, base.endD, ops), fullDays:base.totalDays,
    windowTotal:sumExpenses(wops), windowDays:windowDays, windowEndD:windowEnd,
    byCat:sumBy(wops, 'category'), byAcct:sumBy(wops, 'account')
  };
}
function buildModelFor(s){
  const expenseOps = s.ops.filter(function(o){ return o.kind === 'expense'; });
  const incomeOps = s.ops.filter(function(o){ return o.kind === 'income'; });
  const daily = new Array(s.totalDays).fill(0);
  const dailyOps = new Array(s.totalDays).fill(0);
  for (const o of expenseOps){
    const i = dayDiff(s.startD, o.dateD);
    if (i >= 0 && i < s.totalDays){ daily[i] += o.amount; dailyOps[i] += 1; }
  }
  let run = 0;
  const cum = daily.map(function(v){ run += v; return run; });
  const expenses = expenseOps.reduce(function(a, o){ return a + o.amount; }, 0);
  const income = incomeOps.reduce(function(a, o){ return a + o.amount; }, 0);
  const mandatory = expenseOps.filter(function(o){ return o.mandatory; })
    .reduce(function(a, o){ return a + o.amount; }, 0);

  const catCents = new Map(), catCount = new Map(), catOps = new Map();
  const acctCents = new Map(), acctCount = new Map(), acctOps = new Map();
  for (const o of expenseOps){
    catCents.set(o.category, (catCents.get(o.category) || 0) + o.amount);
    catCount.set(o.category, (catCount.get(o.category) || 0) + 1);
    if (!catOps.has(o.category)) catOps.set(o.category, []);
    catOps.get(o.category).push(o);
    acctCents.set(o.account, (acctCents.get(o.account) || 0) + o.amount);
    acctCount.set(o.account, (acctCount.get(o.account) || 0) + 1);
    if (!acctOps.has(o.account)) acctOps.set(o.account, []);
    acctOps.get(o.account).push(o);
  }

  const categories = Array.from(catCents.keys()).map(function(key){
    const meta = CATEGORY_META[key] || {name:key, color:'graphite', mandatory:false, icon:'dot'};
    return {
      key:key, name:meta.name, color:meta.color, icon:meta.icon,
      mandatory:!!meta.mandatory, cents:catCents.get(key),
      count:catCount.get(key) || 0, ops:catOps.get(key) || []
    };
  }).sort(function(a, b){ return b.cents - a.cents || a.name.localeCompare(b.name, 'ru'); });

  const accounts = Array.from(acctCents.keys()).map(function(key){
    const meta = ACCOUNT_META[key] || {name:key, color:'graphite', icon:'banknote'};
    return {
      key:key, name:meta.name, color:meta.color, icon:meta.icon,
      cents:acctCents.get(key), count:acctCount.get(key) || 0,
      ops:acctOps.get(key) || []
    };
  }).sort(function(a, b){ return b.cents - a.cents || a.name.localeCompare(b.name, 'ru'); });

  const comparison = buildComparison(s);

  /* Absolute spend buckets, not rank quintiles: the biggest day of the period
     must be the darkest cell, whatever the distribution looks like. */
  const ramp = new Map();
  for (let i = 0; i < daily.length; i++) ramp.set(i + 1, heatAlpha(daily[i]));

  const peak = Math.max(expenses, comparison ? comparison.fullTotal : 0, Math.max.apply(null, cum)) / 100;
  const chartMax = Math.max(800, Math.ceil(peak / 400) * 400);

  return {
    scope:s, expenseOps:expenseOps, incomeOps:incomeOps,
    expenses:expenses, income:income, mandatory:mandatory,
    /* Finance.free: income minus mandatory spending, never income minus expenses. */
    available:Math.max(0, income - mandatory),
    free:expenses - mandatory, categories:categories, accounts:accounts,
    daily:daily, dailyOps:dailyOps, cum:cum, comparison:comparison,
    ramp:ramp,
    chartMax:chartMax, avg:Math.round(expenses / Math.max(1, s.elapsed)),
    catOps:catOps, acctOps:acctOps,
    filterCounts:{
      all:categories.length,
      mandatory:categories.filter(function(c){ return c.mandatory; }).length,
      free:categories.filter(function(c){ return !c.mandatory; }).length
    }
  };
}

function visibleSlices(m){
  let list = state.dimension === 'account' ? m.accounts : m.categories;
  if (state.dimension === 'category'){
    if (state.filter === 'mandatory') list = list.filter(function(s){ return s.mandatory; });
    else if (state.filter === 'free') list = list.filter(function(s){ return !s.mandatory; });
  }
  const total = list.reduce(function(a, s){ return a + s.cents; }, 0);
  return list.map(function(s){
    const prev = m.comparison
      ? (state.dimension === 'account' ? m.comparison.byAcct.get(s.key) : m.comparison.byCat.get(s.key))
      : null;
    return Object.assign({}, s, {
      share:total ? s.cents / total * 100 : 0,
      delta:(prev && prev > 0) ? (s.cents - prev) / prev * 100 : null
    });
  });
}
function barLayout(values, totalWidth){
  const gap = 2, min = 4, n = values.length;
  if (!n) return [];
  const available = Math.max(0, totalWidth - gap * (n - 1));
  const sum = values.reduce(function(a, b){ return a + b; }, 0);
  if (sum <= 0) return values.map(function(){ return {width:0, x:0}; });
  const widths = values.map(function(v){ return Math.max(min, available * v / sum); });
  let overflow = widths.reduce(function(a, b){ return a + b; }, 0) - available;
  if (overflow > 0){
    let largest = 0;
    for (let i = 1; i < widths.length; i++) if (widths[i] > widths[largest]) largest = i;
    widths[largest] = Math.max(min, widths[largest] - overflow);
  }
  let x = 0;
  return widths.map(function(w){ const p = {width:w, x:x}; x += w + gap; return p; });
}

function updateHeader(m){

  document.getElementById('scopePeriod').setAttribute('aria-pressed', String(isPeriod));
  document.getElementById('scopeMonth').setAttribute('aria-pressed', String(!isPeriod));
  document.getElementById('stepLabel').innerHTML = isPeriod ? numify(s.title) : numify(monthLabel(s.startD));

  const prevBtn = document.getElementById('stepPrev');
  const nextBtn = document.getElementById('stepNext');

  const atEnd = isPeriod ? state.periodIndex === PERIODS.length - 1 : state.monthIndex === MONTHS.length - 1;
  prevBtn.disabled = atStart;
  nextBtn.disabled = atEnd;
  prevBtn.setAttribute('aria-label', isPeriod ? 'Предыдущий период' : 'Предыдущий месяц');
  nextBtn.setAttribute('aria-label', isPeriod ? 'Следующий период' : 'Следующий месяц');

/* ---------- cards ------------------------------------------------------- */
function summaryCell(label, value, sub, hint){
  return '<div class="summary-cell"' + (hint ? ' title="' + hint + '" aria-label="' + hint + ': ' + label + '"' : '') + '>' +
    '<div class="summary-label">' + label + '</div>' +
    '<div class="summary-value">' + value + '</div>' +
    '<div class="summary-sub">' + sub + '</div></div>';
}
function summaryDelta(m, key, label){
  const prev = m.comparison;
  if (!prev || prev.windowTotal <= 0) return '<span>нет прошлого периода</span>';
  const d = (m.expenses - prev.windowTotal) / prev.windowTotal * 100;
  const dir = d > 0.05 ? 'up' : d < -0.05 ? 'down' : null;
  const tone = d > 0.05 ? 'check' : d < -0.05 ? 'safe' : 'neutral';
  return '<span class="delta"><span class="tone-' + tone + '">' + chev(dir) + '</span>' +
    fig(key, 'pct', d, true) + ' <span>' + label + '</span></span>';
}
function summaryHTML(m){
  const isPeriod = m.scope.mode === 'period';
  if (isPeriod){
    const shareAvailable = m.income > 0 ? m.available / m.income * 100 : null;
    const incomeSub = fig('summary.income.count', 'count', m.incomeOps.length) + ' ' +
      pluralIncome(m.incomeOps.length);
    const availableSub = shareAvailable === null
      ? 'доходов нет'
      : fig('summary.available.pct', 'pct', shareAvailable) + ' от доходов';
    return '<section class="card" aria-label="Итоги за выбранный промежуток"><div class="summary">' +
      summaryCell('Расходы', fig('summary.expenses', 'money', m.expenses),
        summaryDelta(m, 'summary.delta', 'к этому дню прошлого')) +
      summaryCell('Доходы', fig('summary.income', 'money', m.income), incomeSub) +
      summaryCell('Свободно', fig('summary.available', 'money', m.available), availableSub,
        'Доходы минус обязательные расходы') +
      '</div></section>';
  }
  /* Month scope: three spending facts. No income, no remainder, nothing negative. */
  const mandShare = m.expenses > 0 ? m.mandatory / m.expenses * 100 : null;
  const freeShare = m.expenses > 0 ? m.free / m.expenses * 100 : null;
  return '<section class="card" aria-label="Итоги за выбранный месяц"><div class="summary">' +
    summaryCell('Расходы', fig('summary.expenses', 'money', m.expenses),
      /* The stepper names the month, so «прошлого» is unambiguous here — and
         the full phrase «…прошлого месяца» does not fit a third of the card. */
      summaryDelta(m, 'summary.delta', 'к этому дню прошлого')) +
    summaryCell('Обязательные', fig('summary.mandatory', 'money', m.mandatory),
      mandShare === null ? '—' : fig('summary.mandatory.pct', 'pct', mandShare) + ' расходов') +
    summaryCell('Свободные', fig('summary.free', 'money', m.free),
      freeShare === null ? '—' : fig('summary.free.pct', 'pct', freeShare) + ' расходов') +
    '</div></section>';
}

function inlineOpsHTML(s, m){

function chartGeom(m){
  const x0 = 44, x1 = 648, top = 10, base = 140, W = 664, H = 168;
  const days = m.scope.totalDays;
  return {
    x0:x0, x1:x1, top:top, base:base, W:W, H:H, days:days,
    X:function(d){ return days <= 1 ? x0 : x0 + (d - 1) / (days - 1) * (x1 - x0); },
    Y:function(v){ return base - (v / m.chartMax) * (base - top); }
  };
}
function chartSVG(m){
  const g = chartGeom(m);
  const days = g.days;
  let grid = '';
  for (let v = 0; v <= m.chartMax; v += 400){
    const y = g.Y(v);
    grid += '<line class="chart-grid" x1="' + g.x0 + '" y1="' + y + '" x2="' + g.x1 + '" y2="' + y + '"/>';
    grid += '<text class="chart-label num" x="30" y="' + (y + 3.5) + '" text-anchor="end">' + n0(v) + '</text>';
  }
  const marker = m.scope.daysLeft > 0 ? m.scope.elapsed : null;
  const ticks = new Set([1]);
  for (let d = 5; d <= days; d += 5) ticks.add(d);
  if (marker) ticks.add(marker);
  let labels = '';
  Array.from(ticks).sort(function(a, b){ return a - b; }).forEach(function(d){
    if (marker && d !== marker && Math.abs(d - marker) < 2) return;
    const isToday = !!marker && d === marker;
    const label = isToday ? 'сегодня' : n0(d);
    labels += '<text class="chart-label' + (isToday ? ' chart-label-word' : ' num') + '" x="' + g.X(d) + '" y="157" text-anchor="middle">' + label + '</text>';
  });

  let prevLine = '';
  if (m.comparison){
    const pts = [];
    const max = Math.min(m.comparison.fullCum.length, days);
    for (let i = 0; i < max; i++) pts.push(g.X(i + 1) + ',' + g.Y(m.comparison.fullCum[i] / 100));
    if (pts.length > 1) prevLine = '<polyline class="chart-prev" points="' + pts.join(' ') + '"/>';
  }
  let paceLine = '';
  if (m.comparison){
    paceLine = '<line class="chart-pace" x1="' + g.X(1) + '" y1="' + g.Y(0) + '" x2="' + g.X(days) + '" y2="' +
      g.Y(m.comparison.fullTotal / 100) + '"/>';
  }
  const curPts = [];
  for (let i = 0; i < m.scope.elapsed; i++) curPts.push(g.X(i + 1) + ',' + g.Y(m.cum[i] / 100));
  let area = '', current = '';
  if (curPts.length){
    area = '<polygon points="' + g.X(1) + ',' + g.base + ' ' + curPts.join(' ') + ' ' +
      g.X(m.scope.elapsed) + ',' + g.base + '" fill="url(#chartArea)"/>';
    current = '<polyline class="chart-cur" points="' + curPts.join(' ') + '"/>';
  }
  let today = '';
  if (marker){
    const x = g.X(marker), y = g.Y(m.cum[marker - 1] / 100);
    today = '<line class="chart-today" x1="' + x + '" y1="' + g.top + '" x2="' + x + '" y2="' + g.base + '"/>' +
      '<circle class="chart-dot-ring" cx="' + x + '" cy="' + y + '" r="4.5"/>' +
      '<circle class="chart-dot" cx="' + x + '" cy="' + y + '" r="2.5"/>';
  }
  const aria = 'График накопительных расходов. ' + money(m.expenses) + ' за ' + m.scope.elapsed + ' ' +
    dayAcc(m.scope.elapsed) + '.' + (m.comparison ? ' На этот день прошлого периода: ' + money(m.comparison.windowTotal) + '.' : '') +
    ' Стрелки влево и вправо показывают дни.';
  return '<svg class="chart-svg" id="chartSVG" tabindex="0" role="group" aria-describedby="chartKey" aria-label="' + esc(aria) + '" viewBox="0 0 664 168" width="664" height="168">' +
    '<defs><linearGradient id="chartArea" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" style="stop-color:var(--text-primary);stop-opacity:.10"/>' +
      '<stop offset="1" style="stop-color:var(--text-primary);stop-opacity:0"/>' +
    '</linearGradient></defs>' +
    grid + labels + area + prevLine + paceLine + current + today +
    '<g id="chartCross" style="display:none"><line class="chart-cross" x1="0" y1="' + g.top + '" x2="0" y2="' + g.base + '"/></g>' +
    '</svg>';
}
function verdictHTML(m){
  const s = m.scope, cmp = m.comparison;
  let tone = 'neutral', dir = 'up', text = '';
  if (cmp){
    const diff = m.expenses - cmp.windowTotal;
    dir = diff < 0 ? 'down' : 'up';
    tone = diff > 0 ? 'check' : diff < 0 ? 'safe' : 'neutral';
    const part = diff === 0
      ? 'сейчас ровно столько же'
      : 'сейчас ' + (diff > 0 && s.daysLeft > 0 ? 'уже ' : '') + 'на ' + money(Math.abs(diff)) + ' ' + (diff > 0 ? 'больше' : 'меньше');
    if (s.mode === 'period'){
      text = 'Прошлый период закончился на ' + money(cmp.fullTotal) + ' — ' + part +
        (s.daysLeft > 0 ? ', и до конца периода ещё ' + s.daysLeft + ' ' + dayAcc(s.daysLeft) : '') + '.';
    } else if (s.daysLeft > 0){
      const lead = s.elapsed === 1 ? 'За первый день прошлого месяца' : 'За первые ' + s.elapsed + ' ' + dayAcc(s.elapsed) + ' прошлого месяца';
      text = lead + ' — ' + money(cmp.windowTotal) + '; ' + part +
        ', и до конца месяца ещё ' + s.daysLeft + ' ' + dayAcc(s.daysLeft) + '.';
    } else {
      text = 'Прошлый месяц закончился на ' + money(cmp.fullTotal) + ' — ' + part + '.';
    }
  } else {
    text = 'За ' + s.totalDays + ' ' + dayAcc(s.totalDays) + ' потрачено ' +
      money(m.expenses) + ' — это ' + money(m.avg) + ' в день.';
  }
  if (!cmp){
    return '<p>' + numify(text) + '</p>';
  }
  return '<span class="arrow tone-' + tone + '">' + ic(dir === 'down' ? 'arrowDownRight' : 'arrowUpRight', 12) + '</span>' +
    '<p>' + numify(text) + '</p>';
}
function chartKeyHTML(){

function heatHTML(m){
  const s = m.scope;
  const leading = (s.startD.getUTCDay() + 6) % 7;
  const cellsCount = Math.ceil((leading + s.totalDays) / 7) * 7;
  const cellList = [];
  for (let i = 0; i < cellsCount; i++){
    const d = i - leading + 1;
    if (d < 1 || d > s.totalDays){
      cellList.push('<div class="heat-cell is-empty" aria-hidden="true"></div>');
      continue;
    }
    const date = addDays(s.startD, d - 1);
    const cents = m.daily[d - 1];
    const isFuture = d > s.elapsed;
    const isToday = s.live && isoOf(date) === TODAY;
    const ramp = m.ramp.get(d) || 0;
    const cls = ['heat-cell', cents > 0 ? '' : 'is-zero', isFuture ? 'is-future' : '',
      isToday ? 'is-today' : ''].filter(Boolean).join(' ');
    const aria = shortDate(date) + ': ' + (cents > 0 ? money(cents) + ' расходов' : 'нет расходов');
    /* A new month inside the grid is named, so a 15 окт. — 14 нояб. span
       cannot be read as one calendar month. */
    const dayLabel = date.getUTCDate() === 1 ? shortDate(date) : String(date.getUTCDate());
    cellList.push('<div class="' + cls + '" role="gridcell" data-day="' + d + '" style="--ramp:' + ramp +
      '" aria-label="' + esc(aria) + '">' +
      '<span class="heat-day num">' + dayLabel + '</span>' +
      (cents > 0 ? '<span class="heat-amt num">' + n2(cents / 100) + '</span>' : '') +
      '</div>');
  }
  /* One role="row" per week: a grid without rows is a half-declared grid. */
  let rows = '';
  for (let r = 0; r * 7 < cellList.length; r++){
    rows += '<div class="heat-row" role="row">' + cellList.slice(r * 7, r * 7 + 7).join('') + '</div>';
  }
  const weekdays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(function(w, i){
    return '<span' + (i >= 5 ? ' class="is-weekend"' : '') + '>' + w + '</span>';
  }).join('');
  const legend = '<div class="legend"><span class="lbl">меньше</span>' +
    HEAT_STEPS.map(function(a){ return '<span class="sq"><i style="opacity:' + a + '"></i></span>'; }).join('') +
    '<span class="lbl">больше</span></div>';
  const title = s.mode === 'period' ? 'По дням периода' : 'По дням месяца';
  return '<section class="card" aria-labelledby="heatTitle">' +
    '<div class="card-head"><h2 id="heatTitle">' + title + '</h2>' + legend + '</div>' +
    '<div class="heat-week" aria-hidden="true">' + weekdays + '</div>' +
    '<div class="heat-grid" id="heatGrid" role="grid" tabindex="0" aria-rowcount="' + (cellList.length / 7) + '" aria-label="Календарь расходов. Стрелки — выбрать день.">' + rows + '</div>' +
    '<div class="heat-readout" id="heatReadout" aria-live="polite">Наведите на день</div>' +
    '</section>';
}
/* ---------- observations ------------------------------------------------ */
/* The verb has to agree with the category noun: «Еда выросла», «Транспорт
   вырос», «Жильё выросло», «Развлечения выросли». */
const CATEGORY_GENDER = {
  housing:'n', food:'f', transport:'m', health:'n', other:'n',
  restaurants:'pl', shopping:'pl', subscriptions:'pl', entertainment:'pl'
};
function grewVerb(key){
  const g = CATEGORY_GENDER[key];
  if (g === 'f') return 'выросла';
  if (g === 'm') return 'вырос';
  if (g === 'pl') return 'выросли';
  return 'выросло';
}
function obsRow(icon, color, title, detail){

    '<span class="tile" style="--tile:var(--tile-' + color + ');--cut:var(--tile-' + color + ')">' +
      ic(icon, 13) + '</span>' +
    '<span class="obs-text">' +
      '<span class="obs-title">' + numify(title) + '</span>' +
      '<span class="obs-detail">' + numify(detail) + '</span>' +
    '</span></div>';
}
function observationsHTML(m){
  const cats = m.categories.filter(function(c){ return c.cents > 0; });
  const rows = [];

  if (m.expenses > 0){
    rows.push(obsRow('shield', 'amber',
      'Обязательные — ' + pct(m.mandatory / m.expenses * 100) + ' расходов',
      money(m.mandatory) + ' из ' + money(m.expenses)));
  }

  const top = cats.slice().sort(function(a, b){ return b.cents - a.cents; })[0];
  if (top){
    const share = top.cents / m.expenses * 100;
    rows.push(obsRow(top.icon, top.color,
      top.name + (share > 50 ? ' — больше половины трат'
        : share >= 40 ? ' — почти половина трат'
        : ' — самая затратная категория'),
      money(top.cents) + ' · ' + pct(share) + ' всех расходов'));
  }

  let growth = null, drop = null;
  cats.forEach(function(c){
    const prev = m.comparison ? m.comparison.byCat.get(c.key) : null;
    if (!prev || prev <= 0) return;
    const d = (c.cents - prev) / prev * 100;
    if (d > 0 && (!growth || d > growth.d)) growth = {c:c, prev:prev, d:d};
    if (d < 0 && (!drop || d < drop.d)) drop = {c:c, prev:prev, d:d};
  });

  if (growth){
    rows.push(obsRow(growth.c.icon, growth.c.color,
      growth.c.name + ' ' + grewVerb(growth.c.key) + ' на ' + pct(growth.d),
      money(growth.c.cents) + ' против ' + money(growth.prev)));
  } else if (m.expenses > 0){
    let topIdx = -1, topCents = 0;
    m.daily.forEach(function(c, i){ if (c > topCents){ topCents = c; topIdx = i; } });
    if (topIdx >= 0){
      rows.push(obsRow('calendar', 'blue', 'Самый дорогой день',
        shortDate(addDays(m.scope.startD, topIdx)) + ' · ' + money(topCents)));
    }
  }

  if (drop){
    rows.push(obsRow(drop.c.icon, drop.c.color,
      drop.c.name + ' — на ' + pct(Math.abs(drop.d)) + ' меньше',
      money(drop.c.cents) + ' против ' + money(drop.prev)));
  } else if (m.expenses > 0){
    rows.push(obsRow('chart', 'graphite', 'В среднем ' + money(m.avg) + ' в день',
      m.scope.elapsed < m.scope.totalDays
        ? 'за ' + m.scope.elapsed + ' из ' + m.scope.totalDays + ' дня'
        : 'за ' + m.scope.totalDays + ' ' + (m.scope.totalDays % 10 === 1 && m.scope.totalDays % 100 !== 11 ? 'день' : 'дней')));
  }

  if (!rows.length) return '';
  return '<section class="card" aria-labelledby="obsTitle">' +
    '<div class="card-head"><h2 id="obsTitle">Наблюдения</h2></div>' +
    rows.join('') + '</section>';
}

/* ---------- figure motion ----------------------------------------------- */
function snapshotFigures(){
  const map = new Map();
  content.querySelectorAll('[data-fig]').forEach(function(el){
    map.set(el.getAttribute('data-fig'), parseFloat(el.getAttribute('data-value')));
  });
  return map;
}
function animateFigures(prev){
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  content.querySelectorAll('[data-fig]').forEach(function(el){
    const key = el.getAttribute('data-fig');
    const target = parseFloat(el.getAttribute('data-value'));
    const fmt = el.getAttribute('data-fmt');
    const sign = el.getAttribute('data-sign') === '1';
    const old = prev.get(key);
    if (reduced || old === undefined || !isFinite(old) || Math.abs(old - target) < 0.0001){
      el.textContent = fmtFigure(fmt, target, sign);
      return;
    }
    let start = null;
    el.classList.add('fig-anim');
    function tick(t){
      if (start === null) start = t;
      /* Clamp both ends: measuring from the last frame against a clock that can
         run backwards must never push the figure past its target. */
      const p = Math.max(0, Math.min(1, (t - start) / 450));
      const e = 1 - Math.pow(1 - p, 3);
      if (p < 1){
        el.textContent = fmtFigure(fmt, old + (target - old) * e, sign);
        requestAnimationFrame(tick);
      } else {
        el.textContent = fmtFigure(fmt, target, sign);
        el.classList.remove('fig-anim');
      }
    }
    requestAnimationFrame(tick);
  });
}

/* ---------- chart hover ------------------------------------------------- */
function chartDayAt(svg, clientX){
  const m = currentModel;
  if (!m) return 1;
  const rect = svg.getBoundingClientRect();
  const sx = (clientX - rect.left) * (664 / rect.width);
  const g = chartGeom(m);
  if (g.days <= 1) return 1;
  const step = (g.x1 - g.x0) / (g.days - 1);
  return Math.max(1, Math.min(g.days, Math.round(1 + (sx - g.x0) / step)));
}
function showChartDay(day, svg){
  const m = currentModel;
  if (!m) return;
  const g = chartGeom(m);
  const x = g.X(day);
  const cross = svg.querySelector('#chartCross');
  if (cross){
    cross.style.display = '';
    const line = cross.querySelector('line');
    line.setAttribute('x1', x); line.setAttribute('x2', x);
  }
  const tip = document.getElementById('chartTip');
  if (!tip) return;
  let html = '<div class="tip-date">' + numify(shortDate(addDays(m.scope.startD, day - 1))) + '</div>';
  const cur = day <= m.scope.elapsed ? m.cum[day - 1] : null;
  html += '<div class="tip-value num">' + (cur !== null ? money(cur) : '—') + '</div>';
  if (m.comparison){
    const pv = m.comparison.fullCum[day - 1];
    if (pv !== undefined) html += '<div class="tip-prev">' + numify('на этот день: ' + money(pv)) + '</div>';
  }
  tip.innerHTML = html;
  tip.hidden = false;
  const left = x > 664 - 170 ? x - 158 - 12 : x + 10;
  tip.style.left = Math.max(6, Math.min(left, 664 - 158 - 6)) + 'px';
  const yPoint = cur !== null ? g.Y(cur / 100) : g.base;
  let top = yPoint < 92 ? yPoint + 12 : yPoint - 62;
  tip.style.top = Math.max(4, Math.min(top, 168 - 58 - 4)) + 'px';
  state.chartDay = day;
  svg.setAttribute('aria-label', 'График накопительных расходов. ' +
    shortDate(addDays(m.scope.startD, day - 1)) + ': ' + (cur !== null ? money(cur) : 'нет данных') +
    (m.comparison && m.comparison.fullCum[day - 1] !== undefined ? '. На этот день: ' + money(m.comparison.fullCum[day - 1]) : '') + '.');
}
function hideChart(){
  const svg = content.querySelector('.chart-svg');
  const tip = document.getElementById('chartTip');
  if (tip) tip.hidden = true;
  if (svg){
    const cross = svg.querySelector('#chartCross');
    if (cross) cross.style.display = 'none';
    const m = currentModel;
    if (m){
      svg.setAttribute('aria-label', 'График накопительных расходов. ' + money(m.expenses) + ' за ' +
        m.scope.elapsed + ' ' + dayAcc(m.scope.elapsed) + '.' +
        (m.comparison ? ' На этот день прошлого периода: ' + money(m.comparison.windowTotal) + '.' : '') +
        ' Стрелки влево и вправо показывают дни.');
    }
  }
  state.chartDay = null;
}

/* ---------- render ------------------------------------------------------ */
function focusByKey(key){
  if (!key) return;
  const el = content.querySelector('[data-focus-key="' + String(key).replace(/"/g, '\\"') + '"]');
  if (el){ try { el.focus({preventScroll:true}); } catch (e) { el.focus(); } }
}
function render(opts){
  opts = opts || {};
  const prev = snapshotFigures();
  const active = document.activeElement;
  const focusKey = opts.focusKey || (active && active.getAttribute ? active.getAttribute('data-focus-key') : null);
  const scroll = content.scrollTop;
  const m = buildModelFor(currentScope());
  currentModel = m;
  updateHeader(m);
  content.innerHTML = state.empty
    ? emptyHTML()
    : summaryHTML(m) + categoriesHTML(m) + paceHTML(m) + heatHTML(m) + observationsHTML(m);
  content.scrollTop = scroll;
  if (opts.scrollKey){
    const el = content.querySelector('[data-focus-key="' + opts.scrollKey.replace(/"/g, '\\"') + '"]');
    if (el) el.scrollIntoView({block:'nearest'});
  }
  if (focusKey) focusByKey(focusKey);
  if (opts.reveal){
    const inline = content.querySelector('.ops-inline');
    if (inline) inline.scrollIntoView({block:'nearest'});
  }
  animateFigures(prev);
  updateDev(m);
  updateDevButtons();
  if (state.calendarDay !== null && !state.empty) setCalendarDay(state.calendarDay);
  const activeEl = document.activeElement;
  let highlight = activeEl && activeEl.getAttribute ? activeEl.getAttribute('data-hl') : null;
  if (!highlight){
    const hovered = content.querySelector('.slice-row:hover, .seg:hover');
    if (hovered) highlight = hovered.getAttribute('data-hl');
  }
  setHighlight(highlight);
}

/* ---------- self check -------------------------------------------------- */
function runSelfCheck(){
  const problems = [];
  const contract = {
    categories:{housing:67552, food:35245, transport:13217, restaurants:10280,
      subscriptions:7343, shopping:5874, health:4406, entertainment:2936},
    total:146853, mandatory:120420, free:26433, income:420000, previous:131104
  };
  const s = periodScope(PERIODS.length - 1);
  const m = buildModelFor(s);
  const got = new Map();
  m.categories.forEach(function(c){ got.set(c.key, c.cents); });
  Object.keys(contract.categories).forEach(function(key){
    const want = contract.categories[key];
    const have = got.get(key) || 0;
    if (have !== want){
      problems.push((CATEGORY_META[key] ? CATEGORY_META[key].name : key) + ': ' + money(have) + ' вместо ' + money(want));
    }
  });
  if (m.expenses !== contract.total) problems.push('Расходы: ' + money(m.expenses) + ' вместо ' + money(contract.total));
  if (m.mandatory !== contract.mandatory) problems.push('Обязательные: ' + money(m.mandatory) + ' вместо ' + money(contract.mandatory));
  if (m.free !== contract.free) problems.push('Свободные: ' + money(m.free) + ' вместо ' + money(contract.free));
  if (m.income !== contract.income) problems.push('Доходы: ' + money(m.income) + ' вместо ' + money(contract.income));
  if (m.comparison && m.comparison.fullTotal !== contract.previous){
    problems.push('Прошлый период: ' + money(m.comparison.fullTotal) + ' вместо ' + money(contract.previous));
  }
  const sharesSum = m.expenses ? m.categories.reduce(function(a, c){
    return a + c.cents / m.expenses * 100;
  }, 0) : 0;
  if (Math.abs(sharesSum - 100) > 0.2) problems.push('Сумма долей: ' + sharesSum.toFixed(2) + '%');
  const cumEnd = m.cum[m.scope.elapsed - 1] || 0;
  if (cumEnd !== m.expenses) problems.push('Накопительный итог: ' + money(cumEnd) + ' вместо ' + money(m.expenses));

  PERIODS.forEach(function(p){
    ALL_OPS.forEach(function(o){
      if (o.date >= p.start && o.date <= p.end && o.date > p.today){
        problems.push('Операция ' + o.date + ' позже today периода ' + p.key);
      }
    });
  });
  PERIODS.forEach(function(p, i){
    const pm = buildModelFor(periodScope(i));
    const categorySum = pm.categories.reduce(function(a, c){ return a + c.cents; }, 0);
    if (categorySum !== pm.expenses) problems.push(p.key + ': сумма категорий ' + money(categorySum) + ' вместо ' + money(pm.expenses));
    if (pm.mandatory + pm.free !== pm.expenses) problems.push(p.key + ': обязательные + свободные не равны расходам');
    if (pm.cum[pm.scope.elapsed - 1] !== pm.expenses) problems.push(p.key + ': накопительный итог не равен расходам');
    const periodShares = pm.expenses ? pm.categories.reduce(function(a, c){
      return a + c.cents / pm.expenses * 100;
    }, 0) : 100;
    if (Math.abs(periodShares - 100) > 0.2) problems.push(p.key + ': сумма долей ' + periodShares.toFixed(2) + '%');
  });
  ALL_OPS.forEach(function(o){
    const owners = PERIODS.filter(function(p){ return o.date >= p.start && o.date <= p.end; });
    if (owners.length === 0) problems.push('Операция ' + o.date + ' вне периодов');
    if (owners.length > 1) problems.push('Операция ' + o.date + ' попадает в несколько периодов');
    if (o.date > TODAY) problems.push('Операция ' + o.date + ' позже сегодняшнего дня');
  });

  const totals = {
    expenses:+(m.expenses / 100).toFixed(2),
    income:+(m.income / 100).toFixed(2),
    mandatory:+(m.mandatory / 100).toFixed(2),
    free:+(m.free / 100).toFixed(2),
    operations:m.scope.ops.length,
    categories:m.categories.length,
    sharesSum:+sharesSum.toFixed(2),
    cumulativeEnd:+(cumEnd / 100).toFixed(2),
    previous:m.comparison ? +(m.comparison.fullTotal / 100).toFixed(2) : null
  };
  SELF = {ok:problems.length === 0, problems:problems, totals:totals};
  window.__selfCheck = function(){
    return {ok:SELF.ok, problems:SELF.problems.slice(), totals:Object.assign({}, SELF.totals)};
  };
  document.documentElement.setAttribute('data-selfcheck', SELF.ok ? 'ok' : 'fail');
  const json = document.getElementById('selfCheckJSON');
  if (json) json.textContent = JSON.stringify(SELF);
  const status = document.getElementById('devStatus');
  if (status){
    status.textContent = SELF.ok ? 'Суммы сходятся ✓' : 'Проверка: ' + problems.length + ' ' + (problems.length === 1 ? 'проблема' : 'проблемы');
    status.classList.toggle('is-bad', !SELF.ok);
  }
  console.log('ANALYTICS SELF-CHECK: ' + (SELF.ok ? 'OK' : 'FAILED — ' + problems.join('; ')));
}

/* ---------- events ------------------------------------------------------ */
function setTheme(t){
  state.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  updateDevButtons();
  try { localStorage.setItem('montra.analytics.theme', t); } catch (e) {}
}
function setScope(mode){
  if (mode === state.scope) return;
  if (mode === 'month'){
    const key = PERIODS[state.periodIndex].today.slice(0, 7);
    const i = MONTHS.findIndex(function(m){ return m.key === key; });
    if (i >= 0) state.monthIndex = i;
  } else {
    const m = MONTHS[state.monthIndex];
    let idx = PERIODS.findIndex(function(p){ return p.today.slice(0, 7) === m.key; });
    if (idx < 0){
      let best = 0, bestDays = -1;
      PERIODS.forEach(function(p, i){
        const a = p.startD > m.startD ? p.startD : m.startD;
        const b = p.endD < m.capD ? p.endD : m.capD;
        const days = Math.max(0, dayDiff(a, b) + 1);
        if (days > bestDays){ bestDays = days; best = i; }
      });
      idx = best;
    }
    state.periodIndex = idx;
  }
  state.scope = mode;
  state.selected = null;
  state.calendarDay = null;
  state.chartDay = null;
  hideChart();
  render();
}
function step(dir){
  if (state.scope === 'period'){
    const n = state.periodIndex + dir;
    if (n < 0 || n >= PERIODS.length) return;
    state.periodIndex = n;
  } else {
    const n = state.monthIndex + dir;
    if (n < 0 || n >= MONTHS.length) return;
    state.monthIndex = n;
  }
  state.selected = null;
  state.calendarDay = null;
  state.chartDay = null;
  hideChart();
  render();
}
function bindEvents(){
  document.getElementById('scopePeriod').addEventListener('click', function(){ setScope('period'); });
  document.getElementById('scopeMonth').addEventListener('click', function(){ setScope('month'); });
  document.getElementById('stepPrev').addEventListener('click', function(){ step(-1); });
  document.getElementById('stepNext').addEventListener('click', function(){ step(1); });
  document.getElementById('devThemeLight').addEventListener('click', function(){ setTheme('light'); });
  document.getElementById('devThemeDark').addEventListener('click', function(){ setTheme('dark'); });
  document.getElementById('devData').addEventListener('click', function(){
    if (!state.empty) return;
    state.empty = false; state.selected = null; state.calendarDay = null; state.chartDay = null;
    hideChart(); render();
  });
  document.getElementById('devEmpty').addEventListener('click', function(){
    if (state.empty) return;
    state.empty = true; state.selected = null; state.calendarDay = null; state.chartDay = null;
    hideChart(); render();
  });
  document.querySelector('.sidebar').addEventListener('click', function(e){
    const btn = e.target.closest('[data-sidebar-note]');
    if (btn) flashNote(btn.getAttribute('data-sidebar-note'));
  });

  content.addEventListener('click', function(e){
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.getAttribute('data-action');
    if (action === 'dimension'){
      if (state.dimension === btn.getAttribute('data-dim')) return;
      state.dimension = btn.getAttribute('data-dim');
      state.selected = null;
      render({focusKey:'dim.' + state.dimension});
    } else if (action === 'filter'){
      if (state.filter === btn.getAttribute('data-filter')) return;
      state.filter = btn.getAttribute('data-filter');
      state.selected = null;
      render({focusKey:'filter.' + state.filter});
    } else if (action === 'toggle'){
      const id = state.dimension + ':' + btn.getAttribute('data-key');
      const was = state.selected === id;
      state.selected = was ? null : id;
      render({focusKey:'row.' + id, reveal:!was});
    } else if (action === 'select-slice'){
      const id = state.dimension + ':' + btn.getAttribute('data-key');
      state.selected = id;
      render({focusKey:'row.' + id, scrollKey:'row.' + id, reveal:true});
    } else if (action === 'empty-add'){
      flashNote('Прототип: добавление операции не реализовано.');
    }
  });

  content.addEventListener('pointerover', function(e){
    const hl = e.target.closest('[data-hl]');
    if (hl) setHighlight(hl.getAttribute('data-hl'));
    const cell = e.target.closest('.heat-cell[data-day]');
    if (cell) setCalendarDay(Number(cell.getAttribute('data-day')));
  });
  content.addEventListener('pointerout', function(e){
    const hl = e.target.closest('[data-hl]');
    if (hl && (!e.relatedTarget || !hl.contains(e.relatedTarget))) setHighlight(null);
    const cell = e.target.closest('.heat-cell[data-day]');
    if (cell){
      const grid = cell.closest('.heat-grid');
      if (!e.relatedTarget || !grid.contains(e.relatedTarget)){
        if (document.activeElement !== grid) setCalendarDay(null);
      }
    }
  });
  content.addEventListener('pointermove', function(e){
    const svg = e.target.closest('.chart-svg');
    if (!svg || !currentModel) return;
    showChartDay(chartDayAt(svg, e.clientX), svg);
  });
  content.addEventListener('pointerout', function(e){
    const svg = e.target.closest('.chart-svg');
    if (!svg) return;
    if (e.relatedTarget && svg.contains(e.relatedTarget)) return;
    hideChart();
  });

  content.addEventListener('focusin', function(e){
    const row = e.target.closest('.slice-row');
    if (row) setHighlight(row.getAttribute('data-hl'));
    const seg = e.target.closest('.seg');
    if (seg) setHighlight(seg.getAttribute('data-hl'));
    if (e.target.classList.contains('chart-svg') && currentModel){
      showChartDay(currentModel.scope.elapsed, e.target);
    }
    if (e.target.classList.contains('heat-grid') && currentModel){
      if (state.calendarDay === null) setCalendarDay(currentModel.scope.elapsed);
    }
  });
  content.addEventListener('focusout', function(e){
    const row = e.target.closest('.slice-row');
    if (row && (!e.relatedTarget || !row.contains(e.relatedTarget))) setHighlight(null);
    if (e.target.classList.contains('chart-svg')){
      if (!e.relatedTarget || !e.target.contains(e.relatedTarget)) hideChart();
    }
    if (e.target.classList.contains('heat-grid')){
      if (!e.relatedTarget || !e.target.contains(e.relatedTarget)) setCalendarDay(null);
    }
  });

  content.addEventListener('keydown', function(e){
    const row = e.target.closest('.slice-row');
    if (row){
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
        e.preventDefault();
        const rows = Array.from(content.querySelectorAll('.slice-row'));
        const i = rows.indexOf(row);
        const j = i + (e.key === 'ArrowDown' ? 1 : -1);
        if (rows[j]) rows[j].focus();
        return;
      }
      if (e.key === 'Escape' && state.selected){
        e.preventDefault();
        const id = state.selected;
        state.selected = null;
        render({focusKey:'row.' + id});
        return;
      }
    }
    if (e.key === 'Escape' && state.selected){
      e.preventDefault();
      const id = state.selected;
      state.selected = null;
      render({focusKey:'row.' + id});
      return;
    }
    if (e.target.classList.contains('chart-svg') && currentModel){
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
        e.preventDefault();
        const cur = state.chartDay || currentModel.scope.elapsed;
        const day = Math.max(1, Math.min(currentModel.scope.totalDays, cur + (e.key === 'ArrowLeft' ? -1 : 1)));
        showChartDay(day, e.target);
      } else if (e.key === 'Escape'){
        hideChart();
      }
    }
    if (e.target.classList.contains('heat-grid') && currentModel){
      let day = state.calendarDay || currentModel.scope.elapsed;
      if (e.key === 'ArrowLeft') day -= 1;
      else if (e.key === 'ArrowRight') day += 1;
      else if (e.key === 'ArrowUp') day -= 7;
      else if (e.key === 'ArrowDown') day += 7;
      else if (e.key === 'Home') day = 1;
      else if (e.key === 'End') day = currentModel.scope.totalDays;
      else return;
      e.preventDefault();
      setCalendarDay(Math.max(1, Math.min(currentModel.scope.totalDays, day)));
    }
  });
}

/* ---------- init -------------------------------------------------------- */
function init(){
  const params = new URLSearchParams(location.search);
  let theme = params.get('theme');
  if (theme !== 'light' && theme !== 'dark'){
    try { theme = localStorage.getItem('montra.analytics.theme'); } catch (e) { theme = null; }
  }
  state.theme = theme === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  state.empty = params.get('empty') === '1';

  /* Debug-only URL switches used for visual review; normal use ignores them. */
  const qscope = params.get('scope');
  if (qscope === 'month') state.scope = 'month';
  const qmonth = params.get('month');
  if (qmonth){
    const i = MONTHS.findIndex(function(m){ return m.key === qmonth; });
    if (i >= 0){ state.scope = 'month'; state.monthIndex = i; }
  }
  const qperiod = params.get('period');
  if (qperiod){
    const i = PERIODS.findIndex(function(p){ return p.key === qperiod; });
    if (i >= 0){ state.scope = 'period'; state.periodIndex = i; }
  }
  const qdim = params.get('dim');
  if (qdim === 'category' || qdim === 'account') state.dimension = qdim;
  const qfilter = params.get('filter');
  if (qfilter === 'all' || qfilter === 'mandatory' || qfilter === 'free') state.filter = qfilter;
  const qopen = params.get('open');
  if (qopen && CATEGORY_META[qopen]){
    state.dimension = 'category'; state.filter = 'all'; state.selected = 'category:' + qopen;
  } else if (qopen && ACCOUNT_META[qopen]){
    state.dimension = 'account'; state.selected = 'account:' + qopen;
  }

  buildSidebar();
  buildHeader();
  bindEvents();
  runSelfCheck();
  updateDevButtons();
  render();

  const qChart = parseInt(params.get('chart') || '', 10);
  if (Number.isFinite(qChart)){
    requestAnimationFrame(function(){
      const svg = content.querySelector('.chart-svg');
      if (svg) showChartDay(Math.max(1, Math.min(currentModel.scope.totalDays, qChart)), svg);
    });
  }
  const qHeat = parseInt(params.get('heat') || '', 10);
  if (Number.isFinite(qHeat)){
    requestAnimationFrame(function(){
      setCalendarDay(Math.max(1, Math.min(currentModel.scope.totalDays, qHeat)));
    });
  }
  const qhover = params.get('hover');
  if (qhover){
    requestAnimationFrame(function(){ setHighlight(qhover); });
  }

  const scroll = parseInt(params.get('scroll') || '', 10);
  if (Number.isFinite(scroll) && scroll > 0){
    requestAnimationFrame(function(){ content.scrollTop = scroll; });
  }
}
init();

})();
</script>
